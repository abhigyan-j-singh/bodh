# The checks a change must pass: ruff, mypy --strict, the suite with coverage (85% on the core
# modules), pip-audit, and an install smoke test, on three platforms and two Pythons. The
# oldest supported SDK is tested on one leg; the newest SDKs run weekly (weekly.yml).
name: ci

on:
  push:
    branches: [main, oss]
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} / py${{ matrix.python }}${{ matrix.sdk && ' / oldest SDK' || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.10"
            sdk: oldest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Oldest supported SDK
        if: matrix.sdk == 'oldest'
        run: python -m pip install "anthropic==0.77.0"
      - name: Lint and format
        run: |
          ruff check src tests contrib scripts
          ruff format --check src tests contrib scripts
      - name: Types
        run: mypy
      - name: Tests with coverage
        env:
          BODH_PERF: ${{ runner.os == 'Linux' && '1' || '' }}
        run: pytest -q -p no:cacheprovider --cov=bodh --cov-report=term-missing
      - name: Coverage of the core modules (85%)
        run: >
          coverage report --fail-under=85
          --include="src/bodh/store.py,src/bodh/cutting.py,src/bodh/feedback.py,src/bodh/judgment.py,src/bodh/run.py,src/bodh/config.py"
      - name: Dependency audit
        run: pip-audit --progress-spinner off
      - name: Install smoke test
        shell: bash
        run: |
          python -m pip install pipx
          python -m pipx install --force .
          bodh version
          mkdir smoke && cd smoke
          if bodh doctor; then echo "doctor should refuse without config.yaml"; exit 1; fi
          cp ../config.example.yaml config.yaml
          mkdir profile && cp ../profile.example/about.md ../profile.example/learned.md profile/
          bodh doctor --values | head -5
          if bodh doctor; then echo "doctor should report the example profile"; exit 1; fi
