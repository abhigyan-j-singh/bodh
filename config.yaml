# triage configuration. Copy to config.yaml and adjust. Secrets live in .env, never here.

timezone: "Asia/Kolkata"
data_dir: "./data"                 # triage.db, run logs
profile_dir: "./profile"           # seed.md (yours), learner.md (rewritten weekly), a git repo
dashboard_dir: "./dashboard"       # index.html, served with: tailscale serve --bg --set-path / $(pwd)/dashboard
obsidian_note: ""                  # e.g. "~/Obsidian/Main/Triage/Weekly.md"; empty disables the note

models:
  teacher: "claude-sonnet-5-5"     # reads every article
  second_look: "claude-opus-5-5"   # re-reads close calls with the full text; can only save an article
  learner: "claude-opus-5-5"       # rewrites learner.md on Sundays
  batch: true                      # Message Batches API: half price; judgments arrive on the next run (30 min).
                                   # `triage run --sync` waits for every call instead.
  batch_discount: 0.5
  cache_ttl: "1h"                  # the teacher's cached prefix stays warm between runs ("5m" or "1h")
  daily_budget_usd: 8.0            # scoring pauses (nothing is cut) when a day's spend passes this
  est_usd_per_article: 0.001       # the budget check before a batch is submitted, before its usage is known
  prices_per_mtok:                 # input, output, cache read (USD per million tokens); cache writes 1.25x / 2x input
    claude-sonnet-5-5: [2.0, 10.0, 0.10]
    claude-opus-5-5: [4.0, 20.0, 0.20]
    claude-haiku-5-5: [0.10, 0.50, 0.01]   # the stand-in for `triage blast --model claude-haiku-5-5`
    claude-haiku-4-5: [1.0, 5.0, 0.10]

scoring:
  prompt_version: "teacher.v2"     # v2 writes the compact judgment (half the output tokens of v1)
  weights: { quality: 0.30, learning: 0.30, fit: 0.15, breadth: 0.15, relevance: 0.10 }
  expansion_bonus: 10              # points for an article on one of this week's expansion topics
  batch_size: 20                   # articles per teacher call
  workers: 4                       # synchronous runs: teacher calls and second looks in flight at once
  max_per_run: 400                 # synchronous runs: articles scored per run
  batch_max_per_run: 1200          # batch runs: articles submitted per run
  max_age_days: 14                 # unread articles older than this are never scored; `triage bankruptcy` is for them
  opening_chars: 1200              # text the teacher sees on the first pass
  second_look_window: 10           # a floor candidate within this many points of the floor gets a second look...
  second_look_chars: 6000          # ...with this much text, and only when the article has more than the opening

cut:
  enforce: false                   # start in shadow mode: score and tag, cut nothing; flip to true after the shadow days
  target_unread: 40                # `triage prune` with no arguments keeps this many
  default_floor: 35                # automatic floor for folders without their own
  max_cuts_per_run: 500            # a broken prompt costs one undo, not a library
  concept_cap: 0.25                # in a prune, no concept may hold more than this share of survivors
  exploration_share: 0.20          # share of what the floor leaves reserved for new-ground articles
  must_read_stream: "Must read"    # BazQux smart stream whose members are never cut
  folders:                         # your BazQux folders; others use default_floor
    "World News & Politics": { auto_cut_below: 70 }
    "Sports": { auto_cut_below: 70 }
    "Aggregators": { auto_cut_below: 60 }
    "Comics & Fun": { protected: true, score: false }   # never sent to the teacher, never cut

tags:
  buckets: { 90: "score-90", 70: "score-70", 50: "score-50", 30: "score-30", 0: "score-0" }
  cut: "cut"
  # commands: the run acts on them and removes them
  wrong: "wrong"                   # on a cut article you wanted: back to unread, and the strongest positive
  prune: "prune"                   # on any article: the next enforcing run prunes to the target
  # your verdicts: they stay on the article as your record and are recorded once
  great: "great"                   # the best kind; more like this; the Sunday rewrite may not lose it
  good: "good"                     # worth the time
  meh: "meh"                       # not worth it
  bad: "bad"                       # junk; the teacher was wrong to keep it
  basic: "basic"                   # too elementary for you
  heavy: "heavy"                   # too dense or too specialist for you now
  more: "more"                     # more of this article's concept, from the next run
  less: "less"                     # less of it

breakers:
  max_cut_share: 0.95              # a run that would cut more than this share of >= min_new articles stops
  min_new_for_breaker: 50
  rescue_rate_week: 0.05           # rescues above this share of cuts lower the floor to lowered_floor
  lowered_floor: 25
  bulk_dismiss_threshold: 30       # this many non-cut articles going read in one run = mark-all-as-read

feedback:
  concept_window_days: 90
