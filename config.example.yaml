# bodh configuration. `./install.sh` copies this file to config.yaml; edit that one. Every value
# here is the default, so a key you leave out behaves as shown. Secrets live in .env, never here.
# A misspelt key, a value out of range or an unknown timezone is refused with the key named.
# The words are the glossary's (docs/glossary.md): the judge, the review, the profiler, the
# cut-off, autocut, the prune, the catch-up, bands, rescue, safety.

# timezone: "Europe/Lisbon"        # IANA name; the day boundary for the budget and the daily counts.
                                   # Default: the machine's own zone ($TZ, else /etc/localtime, else UTC).
                                   # Windows has no /etc/localtime: set it here.
data_dir: "./data"                 # the database (bodh.db), run logs, progress.json, the lock
profile_dir: "./profile"           # about.md (yours), learned.md (rewritten weekly); its own git repo
dashboard_dir: "./dashboard"       # index.html, the weekly note and the feed report; publish with
                                   # tailscale serve --bg --set-path / $(pwd)/dashboard
obsidian_note: ""                  # also write the weekly note here, e.g. "~/Obsidian/Main/Bodh/Weekly.md";
                                   # empty writes it to dashboard_dir only

models:                            # every model is provider/model-id: anthropic, openai, gemini, openrouter or
                                   # openai-compatible (Ollama and friends); a bare id means anthropic. The provider's
                                   # key goes in .env (`bodh keys set <provider>`); docs/models.md lists what was tested
  judge: "claude-sonnet-5-5"       # reads every article once: the judgment. Changing it re-judges every unread article
                                   # another model rated catch_up.rejudge_at or more (the keepers rest on the judge's
                                   # opinion); `bodh run --rejudge` re-judges them all, `bodh models compare` tries one first
  reviewer: "claude-opus-5-5"      # re-reads close calls with the full text; can only save an article
  profiler: "claude-opus-5-5"      # rewrites profile/learned.md on Sundays
  batch: true                      # Message Batches API: half price; judgments arrive on the next run (30 min).
                                   # false: every call at once, full price (`bodh run --sync` does it once)
  batch_discount: 0.5              # what the API charges for a batch, for the spend figures
  cache_ttl: "1h"                  # the judge's cached prompt prefix stays warm between runs ("5m" or "1h"). 1h costs more
                                   # to write and less to read: a batch may take the hour, and the next run reads the same prefix
  daily_budget_usd: 8.0            # judging pauses (nothing is cut) when a day's spend passes this
  est_usd_per_article: 0.001       # the budget check before a batch is submitted, before its usage is known
  prices_per_mtok:                 # input, output, cache read (USD per million tokens); cache writes 1.25x / 2x input.
                                   # Keyed like the roles: a bare id for Anthropic, provider/model-id for the rest.
                                   # A model id not listed is charged as the dearest one here, with a warning
    claude-sonnet-5-5: [2.0, 10.0, 0.10]
    claude-opus-5-5: [4.0, 20.0, 0.20]
    claude-haiku-5-5: [0.10, 0.50, 0.01]   # the quick judge of `bodh catch-up`
    claude-haiku-4-5: [1.0, 5.0, 0.10]
    # openai/gpt-5-mini: [0.25, 2.0, 0.025]
    # gemini/gemini-2.5-flash: [0.30, 2.50, 0.03]
    # openrouter/qwen/qwen3-235b: [0.20, 0.60]
    # openai-compatible/llama3.3: [0, 0]     # a local model costs nothing per token

judge:
  prompt_version: "teacher.v2"     # the judge's prompt in src/bodh/prompts/ (a ./prompts/ folder next to this
                                   # file overrides it); changing it re-judges everything unread
  weights: { quality: 0.30, learning: 0.30, fit: 0.15, breadth: 0.15, relevance: 0.10 }   # the five sub-scores → the score
  expansion_bonus: 10              # points for an article on one of this week's expansion topics (learned.md)
  home_angle: ""                   # your home ground ("India", "Brazil", "the Pacific Northwest"): an article with that
                                   # angle gets home_bonus points; empty turns the flag off
  home_bonus: 10                   # the points a home-angle article gets
  articles_per_call: 20            # articles in one judge call
  text_chars: 1200                 # the opening the judge sees on the first pass

review:
  window: 10                       # an autocut candidate within this many points of the cut-off is reviewed...
  chars: 6000                      # ...with this much text, and only when the article has more than the opening
  max_per_run: 50                  # synchronous runs: at most this many reviews per run

catch_up:
  model: "claude-haiku-5-5"        # the quick judge `bodh catch-up` uses unless --model says otherwise (provider/model-id)
  rejudge_at: 50                   # what the quick judge rated at least this, the judge reads again; null: never.
                                   # What it rated below stays with the quick judge's verdict: a catch-up's junk is final

limits:
  per_run_sync: 400                # synchronous runs: articles judged per run
  per_run_batch: 1200              # batch runs: articles submitted per run
  parallel_calls: 4                # synchronous runs: judge calls and reviews running at once
  max_age_days: 14                 # unread articles older than this are never judged; `bodh clear-old` is for them

autocut:
  enabled: false                   # start in scoring-only mode: judge and tag, cut nothing; `bodh autocut on` later
  cutoff: 35                       # the cut-off for folders without their own
  max_per_run: 500                 # a broken prompt costs one undo, not a library
  new_ground_share: 0.20           # share of what autocut leaves kept for new ground (a concept you have not read)

prune:
  keep: 40                         # `bodh prune` with no arguments keeps this many
  max_share_per_concept: 0.25      # no concept may hold more than this share of the survivors

protect:
  must_read_stream: "Must read"    # BazQux smart stream whose members are never cut (README: how to create it)

folders:                           # per BazQux folder, names matched exactly (`bodh doctor --live` checks them)
  "Always read": { protected: true }                # never cut
  "Comics": { protected: true, judge: false }       # never sent to the judge, never cut
  "News": { cutoff: 70 }                            # its own, stricter cut-off
  "Aggregators": { cutoff: 60 }

tags:                              # the tag names written to and read from BazQux; change them only before the first run
  bands: { 90: "score-90", 70: "score-70", 50: "score-50", 30: "score-30", 0: "score-0" }   # score band → tag
  cut: "cut"                       # on every article bodh marked read; mark it unread anywhere to rescue it
  # commands: the run acts on them and removes them
  rescue: "rescue"                 # on a cut article you wanted: back to unread, never cut again (`wrong` still works)
  prune: "prune"                   # on any article: the next run with autocut on prunes to prune.keep
  # your verdicts: they stay on the article as your record and are recorded once
  great: "great"                   # the best kind; more like this; the Sunday rewrite may not lose it
  good: "good"                     # worth the time
  meh: "meh"                       # not worth it
  bad: "bad"                       # junk; the judge was wrong to keep it
  basic: "basic"                   # too elementary for you
  heavy: "heavy"                   # too dense or too specialist for you now
  more: "more"                     # more of this article's concept, from the next run
  less: "less"                     # less of it

safety:
  max_cut_share: 0.95              # a run that would cut more than this share of at least min_judged newly judged
  min_judged: 50                   # articles stops before writing, and autocut stays off until `bodh safety reset`
  rescue_rate_week: 0.05           # rescues above this share of a week's cuts (20 cuts at least) lower the cut-off...
  lowered_cutoff: 25               # ...to this, until they fall
  mark_all_read_threshold: 30      # this many kept articles going read in one run is mark-all-as-read, not reads

profile:
  concept_window_days: 90          # how far back stars, reads and verdicts count as what you know
