- id: 34
  title: "Six months with a cheap eDNA kit: a small-lab report"
  feed: "Field Methods Workshop"
  folder: Science
  expected: score-70
  why: useful first-hand evidence for the eDNA decision, from a smaller effort than the big study; less rigorous
  text: |
    We tried a commercial eDNA sampling kit at our estuary station for six months to see whether a
    lab without a molecular biologist could get anything from it. The sampling was easy and the
    filters stored well. The sequencing went to a service provider; the results came back as a
    species list with read counts and little else. The lists were plausible and detected two
    invasive species we had not seen. Where we struggled was in knowing what the read counts meant
    and what a negative result was worth. The per-sample cost was moderate; the real cost was the
    weeks spent learning to read the output. Our conclusion: workable for presence lists, not yet
    for anything quantitative, and you need a friend who does genetics.

