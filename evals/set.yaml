- id: 12
  title: "What I learned writing an image classifier for coral photos with no machine-learning background"
  feed: "A Biologist Learns to Code"
  folder: Essays
  expected: score-70
  why: an honest first-person account of machine learning on ecological images, pitched at her level
  text: |
    I had ten thousand photographs of coral quadrats and a reviewer asking for cover estimates. This
    is what six months of learning to train a classifier taught me, written for the biologist I
    was. The labels were the hard part: thirty hours of drawing polygons, and then the discovery
    that my own labels disagreed with my colleague's on a fifth of the images. The model itself was
    a pretrained network with the last layer retrained, which took an afternoon. The accuracy
    looked wonderful until I tested it on photographs from a different camera. The post ends with
    the checklist I now use: label a test set first, from a different site; measure agreement
    between human labellers before trusting the machine; keep the images small.

- id: 13
  title: "A plain explanation of how the global ocean carries heat, with the numbers"
  feed: "Physical Oceanography Letters"
  folder: Science
  expected: score-70
  why: a good technical introduction to physical oceanography, a goal field; introductory but not thin
  text: |
    The ocean holds ninety percent of the heat the climate system has gained. This article explains
    how that heat moves: the wind-driven gyres in the top kilometre, the slow overturning that
    sinks cold water in the North Atlantic and Southern Ocean, and the eddies, a hundred kilometres
    across, that carry most of the heat across currents. It gives the transports in petawatts, the
    time scales from months to a thousand years, and the measurement methods behind each number,
    from ship sections to the profiling floats. The final section is on what a two-decade warming
    of the deep Atlantic does and does not mean for a coastal shelf. A sound first chapter for
    someone reading into the field.

- id: 14
