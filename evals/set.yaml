- id: 51
  title: "Measuring seagrass carbon: a methods comparison that changes the global estimates"
  feed: "Journal of Coastal Methods"
  folder: Science
  expected: score-70
  why: primary and rigorous, in her own field; she knows the debate, but the method result is new
  text: |
    Estimates of carbon stored under seagrass meadows vary by an order of magnitude between
    studies. We show that most of the variation comes from the method: the depth of the core, the
    treatment of carbonate, and whether the meadow's edge was sampled. Re-analysing 112 published
    cores with one method narrows the global estimate to a range a third as wide, and lower than
    the commonly quoted figure. We provide the correction factors and argue that future studies
    report the raw measurements rather than the derived stock. For anyone who cites seagrass
    carbon numbers, this changes which numbers to cite.

