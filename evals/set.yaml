# The evaluation set: sixty short articles, written for the purpose (none is a real
# publication; names, places and figures are invented), each with the band the example student
# in profile.example (Ines, the marine biologist) should see it in. `bodh eval` judges them
# with the configured judge and prints the agreement by band; tests/test_evals.py checks the
# set itself offline. Add an article by copying an entry; keep texts under 200 words; `why`
# says in one line what makes the band, so a disagreement can be argued about.
#
# bands: score-90 excellent for Ines, score-70 good, score-50 middling, score-30 poor,
# score-0 junk (press releases, listicles, marketing, stubs).

- id: 1
  title: "Comparing environmental DNA and diver transects on twelve Atlantic seagrass meadows"
  feed: "Journal of Coastal Methods"
  folder: Science
  expected: score-90
  why: a primary, careful field comparison on the exact decision in front of her (eDNA against diver surveys)
  text: |
    We sampled twelve seagrass meadows along the Portuguese and Galician coast with paired diver
    transects and one-litre water samples filtered on site, over two seasons. Diver surveys found
    41 fish species; eDNA metabarcoding found 58, including nine cryptic gobies no diver recorded,
    but missed three large transients that divers saw on every visit. Agreement between the two
    methods was highest in sheltered meadows and fell sharply where tidal currents exceeded half a
    knot, which we attribute to eDNA transport from neighbouring habitats. Per site, eDNA cost a
    third of a diver day once the lab pipeline was running, but the first season's set-up cost was
    four times that. We recommend a hybrid design: eDNA for species lists and seasonal presence,
    divers for abundance and size structure. The sampling protocol, primer sets and the full
    occurrence table are in the supplement.

- id: 2
  title: "What a sea-surface temperature map does not tell you: a field ecologist's guide to satellite products"
  feed: "Remote Sensing for Ecologists"
  folder: Science
  expected: score-90
  why: a practitioner's technical explainer in a field she wants to read fluently, aimed at exactly her kind of reader
  text: |
    Most ecologists meet satellite data as a pretty map. This guide explains what sits behind it:
    the difference between a level-2 swath and a level-4 gap-filled analysis, why a daily product
    over a cloudy coast is mostly interpolation, how a one-kilometre pixel averages the water your
    transect runs through with the upwelling plume beside it, and when a product's stated error of
    0.3 degrees is honest. It walks through downloading a month of data with a free account,
    extracting a time series at a station's coordinates, and matching it against a logger on the
    sea floor, with the Python shown. The last section is on what to ask a remote-sensing
    collaborator before signing a proposal: which product, which validation sites, and who owns
    the processing chain when the grant ends.

- id: 3
  title: "Fitting a hierarchical occupancy model to five years of coastal survey data"
  feed: "Ecological Statistics Notebook"
  folder: Science
  expected: score-90
  why: a worked, code-backed tutorial on machine learning and statistics on ecological data, pitched above the beginner level she already has
  text: |
    This post works through a real data set: 180 sites, five years, imperfect detection, divers
    who change from year to year. It starts from the simple logistic model that most of us fit and
    shows, with the residuals, where it lies. Then it builds the occupancy model in stages:
    detection as a function of visibility and diver experience, occupancy as a function of depth
    and distance to the nearest meadow, a random effect per site. Each stage has the model code, the
    prior choices explained, and the posterior checks that made the author change her mind twice.
    The surprise was that diver experience mattered more than visibility, which has consequences
    for how to roster a survey season. The data and the notebook are on the author's repository.

- id: 4
  title: "Downscaling a global climate model to a 200-kilometre coastline: what the regional runs got wrong"
  feed: "Climate Modelling Digest"
  folder: Science
  expected: score-90
  why: first-hand technical writing in climate modelling, a goal field, with the failures stated plainly
  text: |
    We ran three regional ocean models nested inside the same global projection for the Iberian
    upwelling coast and compared them with twenty years of mooring data. All three reproduced the
    seasonal cycle; none reproduced the frequency of the short, strong upwelling pulses that drive
    nutrient supply, and the two with coarser vertical resolution produced a shelf that was too
    warm by almost a degree in late summer. The errors did not cancel when the runs were averaged.
    We describe what the vertical grid choice does to the pulse statistics, why the bias is larger
    near the coast than offshore, and which diagnostic a biologist should ask a modeller for before
    using a projection in a habitat forecast: the distribution of event durations, not the mean.

- id: 5
  title: "Moving a field station's twenty years of logger data out of spreadsheets"
  feed: "Research Data Practice"
  folder: Science
  expected: score-90
  why: an honest first-hand account of the exact pipeline decision she faces, with costs and mistakes
  text: |
    Our station kept temperature, salinity and tide-gauge records in spreadsheets, one per
    instrument per year, 340 files in all. This is what moving them into one database cost and
    what we would do differently. The migration took one technician four months, most of it on
    inconsistent timestamps and units; the writing of the loader took two weeks. We chose SQLite
    with a thin schema (instrument, deployment, reading, flag), skipped the cloud entirely, and
    wrote the quality flags as a separate table so a correction never overwrote a reading. The
    gains: a query that used to take a day takes a minute, and three students found errors in the
    old files within a week. The losses: two people who refused to stop using the spreadsheets, and
    one lost year that was never typed in. Schema and scripts attached.

- id: 6
  title: "Why the Canary Current is weakening, and what the moorings say about it"
  feed: "Physical Oceanography Letters"
  folder: Science
  expected: score-90
  why: primary physical oceanography on her own coast, written for a technical reader outside the specialty
  text: |
    The Canary Current carries cool water down the Iberian and Moroccan coasts, and a decline in
    its transport has been reported from satellite altimetry for a decade. We combine fifteen
    years of current-meter moorings with the altimetry and find the decline is real but half the
    size the altimetry alone suggested, because a shift in the current's offshore position was
    being read as a loss of strength. The weakening is concentrated in late summer and coincides
    with a poleward shift of the trade winds. We explain the method for separating position from
    strength, give the uncertainties, and end with what the change implies for upwelling-fed
    ecosystems on the shelf: fewer, longer events rather than weaker ones.

- id: 7
  title: "A drone survey protocol for intertidal meadows that survived a season of use"
  feed: "Field Methods Workshop"
  folder: Science
  expected: score-90
  why: direct, practical evidence for the drone purchase decision, with the failures and the costs
  text: |
    We flew a small multirotor over four intertidal seagrass meadows at every spring low tide for
    one season, 38 flights in all. What worked: a fixed flight plan at 40 metres, overlap of 80
    percent, a pair of ground targets for scale, and flying within an hour of low water. What did
    not: the first camera's rolling shutter, a battery policy that lost two flights to the cold,
    and classification of meadow against algae, which needed hand-labelled training data from
    every month because the colour changed. Cover estimates agreed with quadrat surveys within six
    percent at the three sheltered sites and not at all at the exposed one, where the tide never
    fell far enough. Total cost including the two months of a student's time is given per hectare
    mapped, against the diver survey it replaced.

- id: 8
  title: "Reading a research budget as a lab head: the three lines that decide everything"
  feed: "The Working Scientist"
  folder: Essays
  expected: score-90
  why: unusually good writing on a decision she makes every year, from first-hand experience
  text: |
    Every grant budget has three lines that decide whether the project is alive in year three:
    the salary of the one person who knows how the data flow, the maintenance of the instrument
    that produces it, and the travel that keeps the collaboration honest. Everything else can be
    cut. This essay, by someone who has run a field lab through two funding cycles, is about how
    to protect those lines when the reviewers ask for a ten percent reduction, why equipment
    budgets are easier to defend than people, how to write a data-management line that is not a
    fiction, and what to do in the year the renewal fails. It is specific, unsentimental, and has
    the numbers from the author's own budgets, anonymised but real.

- id: 9
  title: "How ocean colour satellites estimate chlorophyll, and where they fail near the coast"
  feed: "Oceans Explained"
  folder: Science
  expected: score-70
  why: a good explainer in a goal field, clearly written, a little below the level she will need
  text: |
    Chlorophyll from space is an inference, not a measurement. The sensor sees reflected light in
    a handful of bands; an algorithm fitted to open-ocean data turns the blue-to-green ratio into
    a concentration. The article explains the fit, the correction for the atmosphere that removes
    ninety percent of the signal before anything is estimated, and the three reasons coastal water
    breaks the method: suspended sediment, dissolved organic matter from rivers, and the sea floor
    showing through in shallow water. It describes the regional algorithms that try to repair this
    and how a station's own water samples can be used to check them. A clear introduction, with a
    reading list at the end for the next level.

- id: 10
  title: "The lab that stopped running its own servers"
  feed: "Computing in the Sciences"
  folder: Science
  expected: score-70
  why: a thoughtful adjacent case study on the data-pipeline question, from a lab bigger than hers
  text: |
    A genomics group at a mid-sized university describes four years of running its own compute
    cluster, then two years after moving to a national facility. The post is specific about what
    changed: the graduate students stopped spending a third of their time on system
    administration, the queue waits grew to a day in term time, the cost per sample fell by half,
    and the lab lost the ability to run a tool that the facility would not install. The author's
    view is that a small lab should never own hardware it cannot afford to have fail, and that the
    real cost of self-hosting is the person whose career is spent on it. Useful for anyone deciding
    how much infrastructure a field station should carry itself.

