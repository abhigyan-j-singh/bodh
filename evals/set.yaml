  why: specific, first-hand technical writing on the pipeline decision, with the two failures and the costs
  text: |
    Our buoys send a reading every ten minutes over a satellite link. The first pipeline was a
    script on a desk machine that someone restarted after every power cut; the second was a cloud
    service that cost more each month than the buoys did and locked the data in a format we could
    not export. The third, which has run for three years, is described in full: a small server at
    the institution, a queue that tolerates a week of outage, raw messages kept forever, a derived
    table rebuilt from them nightly, quality flags as data, and a dashboard that is a static page.
    The post gives what each attempt cost in money and in the time of the one person who
    understood it, and the two rules we would never break again.
